const fmt = (n) =>
  new Intl.NumberFormat("de-CH", { minimumFractionDigits:2, maximumFractionDigits:2 }).format(n||0);

// ── Fremdwährungen ──────────────────────────────────────────────
// Buchwährung ist CHF (OR 957a Abs. 4). Fremdwährungskonten (nur Aktiven/Passiven)
// führen zusätzlich den Betrag in Originalwährung. Jede Buchung wird zum
// Transaktionskurs in CHF umgerechnet; per Bilanzstichtag werden die Salden zum
// Stichtagskurs bewertet (Bewertungsbuchungen ohne Fremdwährungsbetrag).
const CHF = "CHF";
const COMMON_CURRENCIES = ["EUR","USD","GBP","JPY","SEK","NOK","DKK","CAD","AUD","CNY","PLN","CZK","HUF"];

const fmtRate = (n) =>
  new Intl.NumberFormat("de-CH", { minimumFractionDigits:4, maximumFractionDigits:6 }).format(n||0);
const parseNum = (v) => {
  if(v===null||v===undefined||v==="") return NaN;
  return parseFloat(String(v).replace(/['’\s]/g,"").replace(",","."));
};
const round2 = (n) => Math.round((n+Number.EPSILON)*100)/100;
const accCurrency = (accounts, num) => accounts.find(a=>a.number===num)?.currency || CHF;

// Fremdwährung einer Buchung ermitteln (currency:null = reine CHF-Buchung)
const entryFxCurrency = (accounts, debit, credit) => {
  const cd = accCurrency(accounts,debit), cc = accCurrency(accounts,credit);
  if(cd!==CHF && cc!==CHF && cd!==cc)
    return { error:`Soll (${cd}) und Haben (${cc}) haben verschiedene Fremdwährungen – `+
                   `bitte in zwei Buchungen über ein CHF-Konto erfassen.` };
  return { currency: cd!==CHF ? cd : (cc!==CHF ? cc : null) };
};

// Formular-Update mit gegenseitiger Neuberechnung von CHF-Betrag und Kurs
const fxFormUpdate = (prev, k, v) => {
  const next = { ...prev, [k]:v };
  const fx = parseNum(next.fxAmount), rate = parseNum(next.fxRate), amt = parseNum(next.amount);
  if((k==="fxAmount"||k==="fxRate") && fx>0 && rate>0) next.amount = round2(fx*rate).toFixed(2);
  if(k==="amount" && fx>0 && amt>0) next.fxRate = String(+(amt/fx).toFixed(6));
  return next;
};

// Buchung validieren und normalisieren → { entry } oder { error }
const normalizeEntry = (raw, accounts) => {
  if(!raw.date||!raw.description||!raw.debit||!raw.credit||raw.amount===""||raw.amount==null)
    return { error:"Pflichtfelder: Datum, Text, Soll, Haben, Betrag." };
  if(raw.debit===raw.credit) return { error:"Soll ≠ Haben." };
  const amt = round2(parseNum(raw.amount));
  if(isNaN(amt)||amt<=0) return { error:"Betrag CHF muss > 0 sein." };
  const { currency, error } = entryFxCurrency(accounts, raw.debit, raw.credit);
  if(error) return { error };
  const base = { id:raw.id, date:raw.date, description:raw.description, reference:raw.reference||"",
                 debit:raw.debit, credit:raw.credit, amount:amt };
  if(!currency) return { entry:base };
  if(raw.fxReval) return { entry:{ ...base, fxCurrency:currency, fxAmount:0, fxReval:true } };
  const fx = round2(parseNum(raw.fxAmount));
  if(isNaN(fx)||fx<=0)
    return { error:`Betrag ${currency} muss > 0 sein (oder Buchung als Kursdifferenz markieren).` };
  return { entry:{ ...base, fxCurrency:currency, fxAmount:fx, fxRate:+(amt/fx).toFixed(6) } };
};

// Stichtagsbewertung aller Fremdwährungskonten
//  – Verluste werden immer gebucht (Vorsichtsprinzip, OR 960 Abs. 2)
//  – Gewinne standardmässig nur auf flüssigen Mitteln / kurzfristigen Wertschriften
//    (Konten 10xx, beobachtbarer Marktpreis OR 960b); auf Forderungen und
//    Verbindlichkeiten bleiben unrealisierte Gewinne unberücksichtigt (Imparitätsprinzip)
const computeFxValuation = ({ accounts, getSaldo, getFxSaldo, rates, year }) =>
  accounts
    .filter(a=>(a.currency||CHF)!==CHF && (a.category==="aktiven"||a.category==="passiven"))
    .slice().sort((a,b)=>a.number.localeCompare(b.number))
    .map(a=>{
      const fxSaldo = getFxSaldo(a.number,year);
      const book    = round2(getSaldo(a.number,year));
      const r       = parseNum(rates?.[a.currency]);
      const rate    = r>0 ? r : null;
      const target  = rate ? round2(fxSaldo*rate) : null;
      const diff    = rate ? round2(target-book) : null;
      const isGain  = !!diff && (a.category==="aktiven" ? diff>0 : diff<0);
      const gainAllowed = a.category==="aktiven" && a.number.startsWith("10");
      return { account:a, fxSaldo, book, rate, target, diff, isGain, gainAllowed,
               defaultBook: !!diff && (!isGain || gainAllowed) };
    });

const makeRevalEntry = (row, gainAcc, lossAcc, year, idx) => {
  const a = row.account;
  const increase   = row.diff>0;                       // CHF-Saldo (Normalsicht) steigt
  const accOnDebit = a.category==="aktiven" ? increase : !increase;
  const counter    = row.isGain ? gainAcc : lossAcc;
  return {
    id: Date.now()+idx,
    date: `${year}-12-31`,
    description: `Fremdwährungsbewertung ${a.currency} ${fmt(row.fxSaldo)} @ ${fmtRate(row.rate)} (Kurs${row.isGain?"gewinn":"verlust"})`,
    reference: `FW-BEW-${year}`,
    debit:  accOnDebit ? a.number : counter,
    credit: accOnDebit ? counter  : a.number,
    amount: Math.abs(row.diff),
    fxCurrency: a.currency, fxAmount: 0, fxReval: true,
  };
};

// Real file download for standalone HTML
const dlFile = (content, filename) => {
  const bom = "\uFEFF";
  const blob = new Blob([bom + content], { type: "text/plain;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

    xmlns:w="urn:schemas-microsoft-com:office:word"
    xmlns="http://www.w3.org/TR/REC-html40">

  const blob = new Blob(["\uFEFF" + doc], {

  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// Eingabefelder für Fremdwährungsbuchungen (erscheinen nur, wenn ein FW-Konto beteiligt ist)
// value: { debit, credit, amount, fxAmount, fxRate, fxReval } · onChange(key, value)
const FxInputs = ({ accounts, value, onChange, compact=false }) => {
  const { currency, error } = entryFxCurrency(accounts, value.debit, value.credit);
  if(error) return (
    <div style={{ marginTop:compact?4:10, fontSize:compact?10.5:12, color:"#B45309",
                  padding:compact?0:"6px 10px", background:compact?"none":"#FFFBEB", borderRadius:5 }}>
      ⚠ {error}
    </div>
  );
  if(!currency) return null;
  const sIS = compact
    ? { ...IS, padding:"3px 6px", fontSize:11.5, fontFamily:"'JetBrains Mono',monospace", textAlign:"right" }
    : { ...IS, fontFamily:"'JetBrains Mono',monospace", textAlign:"right" };
  const revalBox = (
    <label style={{ display:"flex", alignItems:"center", gap:5, fontSize:compact?10.5:12,
                    color:"#64748B", cursor:"pointer", whiteSpace:"nowrap" }}
      title="Nur CHF-Betrag ändern, Fremdwährungssaldo bleibt unverändert (Kursdifferenz / Bewertung)">
      <input type="checkbox" checked={!!value.fxReval} onChange={e=>onChange("fxReval",e.target.checked)}/>
      Kursdifferenz (nur CHF)
    </label>
  );
  if(compact) return (
    <div style={{ marginTop:4, display:"flex", flexDirection:"column", gap:3, alignItems:"flex-end" }}>
      {!value.fxReval && <>
        <input type="number" step="0.01" value={value.fxAmount??""} placeholder={`Betrag ${currency}`}
          onChange={e=>onChange("fxAmount",e.target.value)} style={{ ...sIS, width:110 }}/>
        <input type="number" step="0.0001" value={value.fxRate??""} placeholder="Kurs"
          onChange={e=>onChange("fxRate",e.target.value)} style={{ ...sIS, width:110 }}/>
      </>}
      {revalBox}
    </div>
  );
  return (
    <div style={{ marginTop:10, padding:"10px 12px", background:"#FFF7ED", border:"1px solid #FED7AA",
                  borderRadius:7, display:"grid", gridTemplateColumns:"150px 150px 1fr", gap:10, alignItems:"end" }}>
      {!value.fxReval ? <>
        <Field label={`Betrag ${currency} *`}>
          <input type="number" step="0.01" min="0.01" value={value.fxAmount??""} placeholder="0.00"
            onChange={e=>onChange("fxAmount",e.target.value)} style={sIS}/>
        </Field>
        <Field label={`Kurs CHF / 1 ${currency}`}>
          <input type="number" step="0.0001" min="0" value={value.fxRate??""} placeholder="z. B. 0.9350"
            onChange={e=>onChange("fxRate",e.target.value)} style={sIS}/>
        </Field>
      </> : (
        <div style={{ gridColumn:"span 2", fontSize:12, color:"#9A3412", alignSelf:"center" }}>
          Kursdifferenz: nur der CHF-Wert des {currency}-Kontos ändert sich.
        </div>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:4, alignSelf:"center" }}>
        {revalBox}
        {!value.fxReval && (
          <span style={{ fontSize:11, color:MUTED }}>
            Transaktionskurs (Tageskurs bzw. Kurs gemäss Bank-/Kreditkartenbeleg). Der CHF-Betrag wird
            berechnet; wird er überschrieben, passt sich der Kurs an.
          </span>
        )}
      </div>
    </div>
  );
};

    {e.fxReval ? `Kursdifferenz ${e.fxCurrency}` : `${e.fxCurrency} ${fmt(e.fxAmount)} @ ${fmtRate(e.fxRate)}`}
  </div>
);

// ═══════════════════════════════════════════════════════════════
// TAB: JOURNAL
// ═══════════════════════════════════════════════════════════════
function JournalTab({ accounts, setAccounts, entries, setEntries, fxRates, setFxRates, year }) {
  const blank = { date:`${year}-01-01`, description:"", debit:"", credit:"", amount:"", reference:"",
                  fxAmount:"", fxRate:"", fxReval:false };
  const [form,    setForm]    = useState(blank);
  const [error,   setError]   = useState("");
  const [filterY, setFilterY] = useState(true);
  const [sortDir, setSortDir] = useState("desc");
  const [editing, setEditing] = useState(null); // {id, date, description, reference, debit, credit, amount}
  const [editErr, setEditErr] = useState("");

  const f = (k,v) => setForm(p=>fxFormUpdate(p,k,v));

  const startEdit = (e) => setEditing({ ...e, amount: String(e.amount),
    fxAmount: e.fxAmount ? String(e.fxAmount) : "", fxRate: e.fxRate ? String(e.fxRate) : "",
    fxReval: !!e.fxReval });
  const cancelEdit = () => { setEditing(null); setEditErr(""); };
  const saveEdit = () => {
    const { entry, error } = normalizeEntry(editing, accounts);
    if(error){ setEditErr(error); return; }
    setEntries(p=>p.map(e=>e.id===editing.id?entry:e));
    setEditing(null); setEditErr("");
  };
  const ef = (k,v) => setEditing(p=>fxFormUpdate(p,k,v));

  const visible = useMemo(()=>{
    const arr = filterY ? entries.filter(e=>e.date.startsWith(String(year))) : [...entries];
    return arr.sort((a,b)=> sortDir==="desc"
      ? b.date.localeCompare(a.date)||b.id-a.id
      : a.date.localeCompare(b.date)||a.id-b.id);
  },[entries,year,filterY,sortDir]);

  const add = () => {
    const { entry, error } = normalizeEntry(form, accounts);
    if(error){ setError(error); return; }
    setEntries(p=>[...p,{ ...entry, id:Date.now() }]);
    setForm(p=>({...p, description:"", amount:"", reference:"", fxAmount:"", fxReval:false}));
    setError("");
  };

  const [confirmDel, setConfirmDel] = useState(null);
  const del = (id) => setConfirmDel(id);
  const confirmDelete = () => { setEntries(p=>p.filter(e=>e.id!==confirmDel)); setConfirmDel(null); setEditing(null); };

  const exportCSV = () => {
    const h = ["Datum","Belegnr.","Buchungstext","Soll-Nr.","Soll-Konto","Haben-Nr.","Haben-Konto","Betrag CHF",
               "Währung","Betrag FW","Kurs"];
    const rows = visible.map(e=>[
      e.date, e.reference||"", e.description,
      e.debit, accounts.find(a=>a.number===e.debit)?.name||"",
      e.credit, accounts.find(a=>a.number===e.credit)?.name||"",
      Number(e.amount).toFixed(2).replace(".",","),
      e.fxCurrency||"",
      e.fxCurrency ? (e.fxReval ? "Kursdifferenz" : Number(e.fxAmount).toFixed(2).replace(".",",")) : "",
      e.fxCurrency && !e.fxReval ? String(e.fxRate).replace(".",",") : "",
    ]);
    dlFile([h,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n"),
      `Werckmeister_Journal_${year}.csv`);
  };

  const exportJSON = () => {
    dlFile(JSON.stringify({ verein:"Werckmeister", exportDate:new Date().toISOString(),
      year, accounts, entries, fxRates },null,2),
      `Werckmeister_Backup_${new Date().toISOString().slice(0,10)}.json`);
  };

  const importJSON = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.accounts) setAccounts(d.accounts);
        if(d.entries)  setEntries(d.entries);
        setFxRates(d.fxRates||{});
        alert("✓ Backup importiert!");
      } catch { alert("Fehler: Ungültige JSON-Datei."); }
    };
    r.readAsText(file); e.target.value="";
  };

  const total = visible.reduce((s,e)=>s+Number(e.amount),0);
  const accName = (n) => accounts.find(a=>a.number===n)?.name||"";

  return (
    <div>
      <Card title="Neue Buchung erfassen">
        <div style={{ display:"grid", gridTemplateColumns:"150px 1fr 130px 120px", gap:10 }}>
          <Field label="Datum *">
            <input type="date" value={form.date} onChange={e=>f("date",e.target.value)} style={IS} />
          </Field>
          <Field label="Buchungstext *">
            <input type="text" value={form.description}
              onChange={e=>f("description",e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&add()}
              placeholder="z. B. Mitgliederbeitrag Meyer" style={IS} />
          </Field>
          <Field label="Belegnummer">
            <input type="text" value={form.reference} onChange={e=>f("reference",e.target.value)}
              placeholder="RE-001" style={IS} />
          </Field>
          <Field label="Betrag CHF *">
            <input type="number" step="0.05" min="0.01" value={form.amount}
              onChange={e=>f("amount",e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&add()}
              placeholder="0.00"
              style={{...IS,fontFamily:"'JetBrains Mono',monospace",textAlign:"right"}} />
          </Field>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr auto", gap:10, marginTop:10, alignItems:"end" }}>
          <Field label="Soll (Debit) *">
            <AccountSelect accounts={accounts} value={form.debit} onChange={v=>f("debit",v)} />
          </Field>
          <Field label="Haben (Kredit) *">
            <AccountSelect accounts={accounts} value={form.credit} onChange={v=>f("credit",v)} />
          </Field>
          <button onClick={add} style={{...PB,height:38}}>+ Buchen</button>
        </div>
        <FxInputs accounts={accounts} value={form} onChange={f}/>
        {error && (
          <div style={{color:"#DC2626",marginTop:8,fontSize:12,padding:"6px 10px",
                       background:"#FEF2F2",borderRadius:5}}>⚠ {error}</div>
        )}
      </Card>

      {/* Action bar */}
      <div className="no-print" style={{display:"flex",gap:10,marginBottom:12,alignItems:"center",flexWrap:"wrap"}}>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:"#555",cursor:"pointer"}}>
          <input type="checkbox" checked={filterY} onChange={e=>setFilterY(e.target.checked)}/>
          Nur {year}
        </label>
        <button onClick={()=>setSortDir(d=>d==="desc"?"asc":"desc")} style={SB}>
          {sortDir==="desc"?"↓ Neueste":"↑ Älteste"}
        </button>
        <div style={{flex:1}}/>
        <span style={{fontSize:12,color:MUTED}}>{visible.length} Buchungen</span>
        <button onClick={exportCSV} style={SB}>📥 CSV Export</button>
        <button onClick={exportJSON} style={SB}>💾 JSON Backup</button>
        <label style={{...SB,cursor:"pointer",display:"inline-flex",alignItems:"center"}}>
          📤 Restore
          <input type="file" accept=".json" onChange={importJSON} style={{display:"none"}}/>
        </label>
      </div>

      {/* Table */}
      <div style={{background:"white",borderRadius:10,border:"1px solid #E2E8F0",
                   overflow:"auto",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr>
              <Th>Datum</Th>
              <Th>Belegnr.</Th>
              <Th>Buchungstext</Th>
              <Th>Soll</Th>
              <Th>Haben</Th>
              <Th align="right">Betrag CHF</Th>
              <Th className="no-print"/>
            </tr>
          </thead>
          <tbody>
            {visible.length===0 ? (
              <tr><td colSpan={7} style={{padding:36,textAlign:"center",color:MUTED,fontStyle:"italic"}}>
                Noch keine Buchungen — erfasse deine erste Buchung oben.
              </td></tr>
            ) : visible.map(e=>{
              const isEditing = editing?.id===e.id;
              if(isEditing) return (
                <tr key={e.id} style={{background:"#FEFCE8",outline:"2px solid #F59E0B",outlineOffset:"-2px"}}>
                  <Td>
                    <input type="date" value={editing.date} onChange={ev=>ef("date",ev.target.value)}
                      style={{...IS,padding:"4px 6px",fontSize:12,width:130,borderColor:"#F59E0B"}}/>
                  </Td>
                  <Td>
                    <input type="text" value={editing.reference} onChange={ev=>ef("reference",ev.target.value)}
                      placeholder="—" style={{...IS,padding:"4px 6px",fontSize:12,width:90,borderColor:"#F59E0B"}}/>
                  </Td>
                  <Td>
                    <input type="text" value={editing.description} onChange={ev=>ef("description",ev.target.value)}
                      onKeyDown={ev=>{if(ev.key==="Enter")saveEdit();if(ev.key==="Escape")cancelEdit();}}
                      autoFocus style={{...IS,padding:"4px 6px",fontSize:13,borderColor:"#F59E0B",
                                       boxShadow:"0 0 0 3px rgba(245,158,11,.15)"}}/>
                  </Td>
                  <Td>
                    <AccountSelect accounts={accounts} value={editing.debit} onChange={v=>ef("debit",v)}/>
                  </Td>
                  <Td>
                    <AccountSelect accounts={accounts} value={editing.credit} onChange={v=>ef("credit",v)}/>
                  </Td>
                  <Td align="right">
                    <input type="number" step="0.05" value={editing.amount} onChange={ev=>ef("amount",ev.target.value)}
                      onKeyDown={ev=>{if(ev.key==="Enter")saveEdit();if(ev.key==="Escape")cancelEdit();}}
                      style={{...IS,padding:"4px 6px",fontFamily:"'JetBrains Mono',monospace",
                              textAlign:"right",fontSize:13,width:110,borderColor:"#F59E0B"}}/>
                    <FxInputs accounts={accounts} value={editing} onChange={ef} compact/>
                  </Td>
                  <Td className="no-print" align="right">
                    <div style={{display:"flex",gap:4,justifyContent:"flex-end",flexWrap:"wrap"}}>
                      {editErr&&<span style={{fontSize:10,color:"#DC2626",width:"100%",textAlign:"right"}}>{editErr}</span>}
                      <button onClick={saveEdit}
                        style={{...PB,padding:"4px 10px",fontSize:12,background:"#16A34A"}}
                        title="Speichern (Enter)">✓</button>
                      <button onClick={cancelEdit}
                        style={{...SB,padding:"4px 10px",fontSize:12}}
                        title="Abbrechen (Esc)">✕</button>
                      {confirmDel!==e.id
                        ? <button onClick={()=>del(e.id)}
                            style={{...SB,padding:"4px 10px",fontSize:12,borderColor:"#FECACA",color:"#EF4444"}}
                            title="Buchung löschen">🗑</button>
                        : <>
                            <span style={{fontSize:10,color:"#DC2626",alignSelf:"center",fontWeight:600}}>Sicher?</span>
                            <button onClick={confirmDelete} style={{...PB,padding:"4px 8px",fontSize:11,background:"#DC2626"}}>Ja</button>
                            <button onClick={()=>setConfirmDel(null)} style={{...SB,padding:"4px 8px",fontSize:11}}>Nein</button>
                          </>
                      }
                    </div>
                  </Td>
                </tr>
              );
              return (
              <tr key={e.id} className="hover-row">
                <Td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:"#475569"}}>{e.date}</Td>
                <Td style={{color:MUTED,fontSize:12}}>{e.reference||"—"}</Td>
                <Td>{e.description}</Td>
                <Td>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                                fontWeight:700,color:"#1D4ED8"}}>{e.debit}</span>
                  <span style={{color:MUTED,fontSize:11,marginLeft:5}}>{accName(e.debit)}</span>
                </Td>
                <Td>
                  <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,
                                fontWeight:700,color:"#059669"}}>{e.credit}</span>
                  <span style={{color:MUTED,fontSize:11,marginLeft:5}}>{accName(e.credit)}</span>
                </Td>
                <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:500}}>
                  {fmt(e.amount)}<FxAmountNote e={e}/>
                </Td>
                <Td className="no-print" align="right">
                  <div style={{display:"flex",gap:4,justifyContent:"flex-end"}}>
                    <button onClick={()=>startEdit(e)}
                      style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                              fontSize:14,lineHeight:1,transition:"color .15s",padding:"2px 4px"}}
                      onMouseEnter={ev=>ev.currentTarget.style.color="#F59E0B"}
                      onMouseLeave={ev=>ev.currentTarget.style.color="#CBD5E1"}
                      title="Bearbeiten">✏</button>
                    {confirmDel!==e.id
                      ? <button onClick={()=>del(e.id)}
                          style={{background:"none",border:"none",color:"#CBD5E1",cursor:"pointer",
                                  fontSize:16,lineHeight:1,transition:"color .15s",padding:"2px 4px"}}
                          onMouseEnter={ev=>ev.target.style.color="#EF4444"}
                          onMouseLeave={ev=>ev.target.style.color="#CBD5E1"}
                          title="Löschen">×</button>
                      : <div style={{display:"flex",gap:3,alignItems:"center"}}>
                          <span style={{fontSize:10,color:"#DC2626",fontWeight:600}}>Sicher?</span>
                          <button onClick={confirmDelete} style={{...PB,padding:"2px 7px",fontSize:11,background:"#DC2626"}}>Ja</button>
                          <button onClick={()=>setConfirmDel(null)} style={{...SB,padding:"2px 7px",fontSize:11}}>Nein</button>
                        </div>
                    }
                  </div>
                </Td>
              </tr>
              );
            })}
          </tbody>
          {visible.length>0 && (
            <tfoot>
              <tr style={{background:"#F8FAFC"}}>
                <td colSpan={5} style={{padding:"10px 12px",fontWeight:700,fontSize:13,
                                        borderTop:"2px solid #E2E8F0"}}>
                  Total {filterY?year:"alle"} ({visible.length} Buchungen)
                </td>
                <td style={{padding:"10px 12px",textAlign:"right",
                             fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:14,
                             borderTop:"2px solid #E2E8F0",color:"#0F172A"}}>
                  {fmt(total)}
                </td>
                <td className="no-print" style={{borderTop:"2px solid #E2E8F0"}}/>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

// TAB: KONTENPLAN
// ═══════════════════════════════════════════════════════════════
function KontenplanTab({ accounts, setAccounts, entries, getSaldo, getFxSaldo, year }) {
  const blankAcc = {number:"",name:"",category:"aktiven",group:"",currency:CHF};
  const [form,    setForm]    = useState(blankAcc);
  const [error,   setError]   = useState("");
  const [open,    setOpen]    = useState(false);
  const [editing, setEditing] = useState(null); // { number, name, group }
  const [editErr, setEditErr] = useState("");
  const [confirmDel, setConfirmDel] = useState(null); // account number pending deletion

  const f = (k,v) => setForm(p=>({...p,[k]:v}));

  // Fremdwährung nur für Bilanzkonten – Aufwand/Ertrag wird immer in CHF geführt
  const fxAllowed = (cat) => cat==="aktiven"||cat==="passiven";
  const cleanCur  = (c) => (c||CHF).trim().toUpperCase();
  const curError  = (c) => /^[A-Z]{3}$/.test(c) ? "" : "Währung als ISO-Code mit 3 Buchstaben angeben (z. B. EUR).";

  const addAccount = () => {
    if(!form.number.trim()||!form.name.trim()){ setError("Kontonummer und Name sind Pflicht."); return; }
    if(accounts.find(a=>a.number===form.number.trim())){
      setError(`Kontonummer ${form.number} existiert bereits.`); return; }
    const currency = fxAllowed(form.category) ? cleanCur(form.currency) : CHF;
    const ce = curError(currency); if(ce){ setError(ce); return; }
    const acc = {...form,number:form.number.trim(),name:form.name.trim()};
    if(currency===CHF) delete acc.currency; else acc.currency = currency;
    setAccounts(p=>[...p,acc].sort((a,b)=>a.number.localeCompare(b.number)));
    setForm(blankAcc);
    setError(""); setOpen(false);
  };

  const delAccount = (n) => {
    if(window.confirm(`Konto ${n} löschen? Buchungen bleiben erhalten.`))
      setAccounts(p=>p.filter(a=>a.number!==n));
  };

  const startEdit = (a) => {
    setEditing({ number:a.number, name:a.name, group:a.group||"", currency:a.currency||CHF });
    setEditErr("");
  };

  const saveEdit = () => {
    if(!editing.name.trim()){ setEditErr("Bezeichnung darf nicht leer sein."); return; }
    const orig = accounts.find(a=>a.number===editing.number);
    const currency = fxAllowed(orig.category) ? cleanCur(editing.currency) : CHF;
    const ce = curError(currency); if(ce){ setEditErr(ce); return; }
    if(currency!==(orig.currency||CHF) && hasBookings(orig.number)){
      setEditErr("Die Währung kann nur bei Konten ohne Buchungen geändert werden."); return; }
    setAccounts(p => p.map(a => {
      if(a.number!==editing.number) return a;
      const n = { ...a, name:editing.name.trim(), group:editing.group.trim() };
      if(currency===CHF) delete n.currency; else n.currency = currency;
      return n;
    }));
    setEditing(null); setEditErr("");
  };

  const cancelEdit = () => { setEditing(null); setEditErr(""); };

  const hasBookings = (num) => entries.some(e=>e.debit===num||e.credit===num);

  const delEditingAccount = (num) => { setConfirmDel(num); };

  const confirmDelAccount = () => {
    setAccounts(p=>p.filter(a=>a.number!==confirmDel));
    setEditing(null);
    setConfirmDel(null);
  };

  const catCfg = {
    aktiven: {label:"AKTIVEN",   color:"#1D4ED8", bg:"#EFF6FF", border:"#BFDBFE"},
    passiven:{label:"PASSIVEN",  color:"#15803D", bg:"#F0FDF4", border:"#BBF7D0"},
    ertrag:  {label:"ERTRÄGE",   color:"#059669", bg:"#ECFDF5", border:"#A7F3D0"},
    aufwand: {label:"AUFWÄNDE",  color:"#DC2626", bg:"#FEF2F2", border:"#FECACA"},
  };

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:13,color:"#64748B"}}>{accounts.length} Konten · Kontenrahmen {year}</span>
        <button onClick={()=>setOpen(s=>!s)} style={PB}>{open?"Abbrechen":"+ Neues Konto"}</button>
      </div>

      {open && (
        <Card title="Neues Konto anlegen">
          <div style={{display:"grid",gridTemplateColumns:"110px 1fr 150px 1fr 100px auto",gap:10,alignItems:"end"}}>
            <Field label="Konto-Nr. *">
              <input type="text" value={form.number} onChange={e=>f("number",e.target.value)}
                placeholder="z.B. 3600" style={IS}/>
            </Field>
            <Field label="Bezeichnung *">
              <input type="text" value={form.name} onChange={e=>f("name",e.target.value)}
                placeholder="Kontoname" style={IS}/>
            </Field>
            <Field label="Kategorie *">
              <select value={form.category} onChange={e=>f("category",e.target.value)} style={IS}>
                <option value="aktiven">Aktiven</option>
                <option value="passiven">Passiven</option>
                <option value="ertrag">Ertrag</option>
                <option value="aufwand">Aufwand</option>
              </select>
            </Field>
            <Field label="Gruppe">
              <input type="text" value={form.group} onChange={e=>f("group",e.target.value)}
                placeholder="z.B. Vereinserträge" style={IS}/>
            </Field>
            <Field label="Währung">
              <input type="text" list="fx-currencies" maxLength={3}
                value={fxAllowed(form.category)?form.currency:CHF}
                disabled={!fxAllowed(form.category)}
                onChange={e=>f("currency",e.target.value.toUpperCase())}
                style={{...IS,fontFamily:"'JetBrains Mono',monospace",
                        background:fxAllowed(form.category)?"white":"#F1F5F9"}}/>
            </Field>
            <button onClick={addAccount} style={{...PB,height:38}}>Anlegen</button>
          </div>
          <datalist id="fx-currencies">
            {[CHF,...COMMON_CURRENCIES].map(c=><option key={c} value={c}/>)}
          </datalist>
          {fxAllowed(form.category) && cleanCur(form.currency)!==CHF && (
            <div style={{marginTop:8,fontSize:12,color:"#9A3412"}}>
              Fremdwährungskonto: Buchungen werden mit Betrag in {cleanCur(form.currency)} und Kurs erfasst und
              in CHF verbucht. Per 31.12. Bewertung zum Stichtagskurs im Tab «Fremdwährung».
            </div>
          )}
          {error && <div style={{color:"#DC2626",marginTop:8,fontSize:12}}>⚠ {error}</div>}
        </Card>
      )}

      {editErr && (
        <div style={{color:"#DC2626",marginBottom:10,fontSize:12,padding:"6px 10px",
                     background:"#FEF2F2",borderRadius:5}}>⚠ {editErr}</div>
      )}

      {["aktiven","passiven","ertrag","aufwand"].map(cat => {
        const accs = accounts.filter(a=>a.category===cat).sort((a,b)=>a.number.localeCompare(b.number));
        if(!accs.length) return null;
        const cfg = catCfg[cat];
        const total = accs.reduce((s,a)=>s+getSaldo(a.number,year),0);
        return (
          <div key={cat} style={{marginBottom:20}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontWeight:800,fontSize:11,color:cfg.color,letterSpacing:1.5}}>
                {cfg.label}
              </span>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,
                            fontWeight:600,color:cfg.color}}>
                Total: CHF {fmt(total)}
              </span>
            </div>
            <div style={{background:"white",borderRadius:8,border:"1px solid #E2E8F0",overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr>
                    <Th style={{width:80}}>Kto-Nr.</Th>
                    <Th>Bezeichnung</Th>
                    <Th style={{width:200}}>Gruppe</Th>
                    <Th align="right" style={{width:140}}>Saldo {year}</Th>
                    <Th className="no-print" style={{width:90}}/>
                  </tr>
                </thead>
                <tbody>
                  {accs.map(a => {
                    const saldo = getSaldo(a.number,year);
                    const isEditing = editing?.number === a.number;

                    if(isEditing) return (
                      <tr key={a.number} style={{background:"#FEFCE8",outline:"2px solid #F59E0B",
                                                  outlineOffset:"-2px"}}>
                        <Td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,
                                    color:cfg.color,fontSize:12}}>{a.number}</Td>
                        <Td>
                          <input
                            autoFocus
                            type="text"
                            value={editing.name}
                            onChange={e=>setEditing(p=>({...p,name:e.target.value}))}

const HB_CAT_COLOR = {aktiven:"#1D4ED8",passiven:"#15803D",ertrag:"#059669",aufwand:"#DC2626"};

// Kontoblatt mit laufendem Saldo (CHF und ggf. Fremdwährung)
const buildLedger = (acc, entries) => {
  const num = acc.number;
  const cur = acc.currency||CHF;
  const isDbNormal = acc.category==="aktiven"||acc.category==="aufwand";
  const ents = entries.filter(e=>e.debit===num||e.credit===num)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  let run=0, fxRun=0;
  const rows = ents.map(e=>{
    const soll  = e.debit===num  ? Number(e.amount) : null;
    const haben = e.credit===num ? Number(e.amount) : null;
    const sign  = isDbNormal ? (soll!==null?1:-1) : (haben!==null?1:-1);
    run += sign*Number(e.amount);
    const fx = cur!==CHF && e.fxCurrency===cur ? sign*Number(e.fxAmount||0) : 0;
    fxRun += fx;
    const counter = e.debit===num ? e.credit : e.debit;
    return {...e,soll,haben,saldo:round2(run),fx,fxSaldo:round2(fxRun),counter};
  });
  return {
    account: acc, rows,
    totSoll:  rows.reduce((s,r)=>s+(r.soll||0),0),
    totHaben: rows.reduce((s,r)=>s+(r.haben||0),0),
    saldo:    rows.length ? rows[rows.length-1].saldo   : 0,
    fxSaldo:  rows.length ? rows[rows.length-1].fxSaldo : 0,
  };
};

    filterY ? entries.filter(e=>e.date.startsWith(String(year))) : entries

          <div style={{display:"flex",gap:20,flexWrap:"wrap",marginTop:12,padding:"10px 12px",

            </div>
            <div>
              <div style={{fontSize:10,color:MUTED,marginBottom:1}}>Bezeichnung</div>

function BilanzTab({ accounts, getSaldo, getFxSaldo, fxRates, year }) {
  const fxRows = computeFxValuation({ accounts, getSaldo, getFxSaldo, rates:fxRates?.[year], year })
    .filter(r=>r.fxSaldo!==0||r.book!==0);
  const fxMissingRate = fxRows.filter(r=>!r.rate);
  const fxOpenLoss    = fxRows.filter(r=>r.diff && !r.isGain);
  const aktiven  = accounts.filter(a=>a.category==="aktiven").sort((a,b)=>a.number.localeCompare(b.number));
  const passiven = accounts.filter(a=>a.category==="passiven").sort((a,b)=>a.number.localeCompare(b.number));
  const ertraege = accounts.filter(a=>a.category==="ertrag").reduce((s,a)=>s+getSaldo(a.number,year),0);
  const aufwaende= accounts.filter(a=>a.category==="aufwand").reduce((s,a)=>s+getSaldo(a.number,year),0);
  const jahrRes  = ertraege - aufwaende;

  const totalAkt = aktiven.reduce((s,a)=>s+getSaldo(a.number,year),0);
  const totalPas = passiven.reduce((s,a)=>s+getSaldo(a.number,year),0)+jahrRes;
  const diff = Math.abs(totalAkt-totalPas);
  const balanced = diff < 0.01;

  const aktGroups = [...new Set(aktiven.map(a=>a.group))];
  const pasGroups = [...new Set(passiven.map(a=>a.group))];

  const SideSection = ({ accs, group, color }) => {
    const ga = accs.filter(a=>a.group===group);
    const gt = ga.reduce((s,a)=>s+getSaldo(a.number,year),0);
    return (
      <>
        <tr>
          <td colSpan={3} style={{padding:"8px 12px 3px",fontWeight:700,fontSize:10.5,
                                   color:"#64748B",textTransform:"uppercase",letterSpacing:.5}}>
            {group}
          </td>
        </tr>
        {ga.map(a=>{
          const s=getSaldo(a.number,year);
          return (
            <tr key={a.number} className="hover-row">
              <td style={{padding:"4px 12px 4px 22px",fontSize:11.5,
                          fontFamily:"'JetBrains Mono',monospace",color:MUTED}}>{a.number}</td>
              <td style={{padding:"4px 12px",fontSize:13}}>{a.name}<CurBadge cur={a.currency}/></td>
              <td style={{padding:"4px 12px",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                          fontSize:13,fontWeight:s!==0?500:400,color:s!==0?"#0F172A":"#CBD5E1"}}>
                {s!==0?fmt(s):"—"}
                {a.currency&&a.currency!==CHF&&getFxSaldo(a.number,year)!==0&&(
                  <div style={{fontSize:10.5,fontWeight:400,color:"#C2410C"}}>
                    {a.currency} {fmt(getFxSaldo(a.number,year))}
                  </div>
                )}
              </td>
            </tr>
          );
        })}
        <tr style={{borderBottom:"1px solid #E2E8F0"}}>
          <td colSpan={2} style={{padding:"3px 12px 7px 22px",fontSize:11.5,color:MUTED,fontStyle:"italic"}}>
            Subtotal {group}
          </td>
          <td style={{padding:"3px 12px 7px",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                      fontSize:13,fontWeight:600,color}}>{fmt(gt)}</td>
        </tr>
      </>
    );
  };

  const exportBilanzWord = () => {
    const renderSide = (title, accs, groups, color, total) => {
      let h = `<table><tr><th colspan="3" style="background:${color}11;color:${color};font-size:11pt">${title}</th></tr>`;
      groups.forEach(group => {
        const ga = accs.filter(a=>a.group===group);
        const gt = ga.reduce((s,a)=>s+getSaldo(a.number,year),0);
        h += `<tr class="section-header"><td colspan="3">${group}</td></tr>`;
        ga.forEach(a => {
          const s = getSaldo(a.number,year);
          h += `<tr><td class="muted" style="width:60pt">${a.number}</td><td>${a.name}</td><td class="amount">${s!==0?fmt(s):"—"}</td></tr>`;
        });
        h += `<tr><td colspan="2" class="subtotal">Subtotal ${group}</td><td class="amount" style="font-weight:600;color:${color}">${fmt(gt)}</td></tr>`;
      });
      h += `<tr class="total-row" style="color:${color}"><td colspan="2">TOTAL ${title}</td><td class="amount">CHF ${fmt(total)}</td></tr></table>`;
      return h;
    };
    let html = `<h1>Verein Werckmeister</h1><h2>Bilanz per 31. Dezember ${year}</h2>`;
    html += `<table style="border:none"><tr style="vertical-align:top"><td style="border:none;width:50%;padding-right:8pt">`;
    html += renderSide("AKTIVEN", aktiven, aktGroups, "#1D4ED8", totalAkt);
    html += `</td><td style="border:none;width:50%;padding-left:8pt">`;
    let pasHtml = renderSide("PASSIVEN", passiven, pasGroups, "#15803D", totalPas);
    // Jahresergebnis einfügen vor dem letzten </table>
    const jrRow = `<tr class="section-header"><td colspan="3">Jahresergebnis ${year}</td></tr>` +
      `<tr><td class="muted">2900</td><td>${jahrRes>=0?"Jahresgewinn":"Jahresverlust"} ${year}</td>` +
      `<td class="amount" style="font-weight:700;color:${jahrRes>=0?"#15803D":"#DC2626"}">${jahrRes>=0?"":"-"}${fmt(Math.abs(jahrRes))}</td></tr>`;
    pasHtml = pasHtml.replace(/<tr class="total-row"/, jrRow + `<tr class="total-row"`);
    html += pasHtml;
    html += `</td></tr></table>`;
    if(fxRows.length){
      html += `<h2 style="text-align:left;margin-top:14pt">Fremdwährungspositionen per 31.12.${year}</h2><table>`+

      fxRows.forEach(r=>{
        html += `<tr><td class="muted">${r.account.number}</td><td>${r.account.name}</td><td class="center">${r.account.currency}</td>`+
          `<td class="amount">${fmt(r.fxSaldo)}</td><td class="amount">${r.rate?fmtRate(r.rate):"—"}</td>`+
          `<td class="amount">${fmt(r.book)}</td></tr>`;
      });
      html += `</table><p class="muted" style="font-size:9pt">Umrechnung monetärer Fremdwährungspositionen zum Stichtagskurs; `+
        `unrealisierte Kursgewinne auf Forderungen und Verbindlichkeiten werden nach dem Imparitätsprinzip nicht erfasst.</p>`;
    }
    exportWord(html, `Werckmeister_Bilanz_${year}.docx`);
  };

  return (
    <div>
      <div className="no-print" style={{display:"flex",justifyContent:"space-between",
                                        alignItems:"center",marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:13,color:"#64748B"}}>Bilanz per 31. Dezember {year}</span>
          {balanced
            ? <span style={{background:"#F0FDF4",color:"#15803D",padding:"2px 9px",
                            borderRadius:999,fontSize:11,fontWeight:600}}>✓ Ausgeglichen</span>
            : <span style={{background:"#FEF2F2",color:"#DC2626",padding:"2px 9px",
                            borderRadius:999,fontSize:11,fontWeight:600}}>
                Differenz CHF {fmt(diff)}
              </span>
          }
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={exportBilanzWord} style={SB}>📄 Word Export</button>
          <button onClick={()=>window.print()} style={SB}>🖨 Drucken / PDF</button>
        </div>
      </div>

      {/* Print header */}
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontWeight:800,fontSize:18,letterSpacing:-.5}}>Verein Werckmeister</div>
        <div style={{color:"#64748B",fontSize:13,marginTop:3}}>Bilanz per 31. Dezember {year}</div>
        <div style={{color:MUTED,fontSize:11,marginTop:1}}>Schweizer Vereins-Kontenrahmen · Doppelte Buchhaltung</div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
        {/* AKTIVEN */}
        <div style={{background:"white",borderRadius:10,border:"1px solid #BFDBFE",overflow:"hidden",
                     boxShadow:"0 1px 4px rgba(29,78,216,.08)"}}>
          <div style={{padding:"11px 14px",background:"#EFF6FF",borderBottom:"1px solid #BFDBFE",
                       fontWeight:800,fontSize:13,color:"#1D4ED8",letterSpacing:.5}}>
            AKTIVEN
          </div>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <tbody>
              {aktGroups.map(g=><SideSection key={g} accs={aktiven} group={g} color="#1D4ED8"/>)}
            </tbody>
            <tfoot>
              <tr style={{background:"#EFF6FF",borderTop:"2px solid #1D4ED8"}}>
                <td colSpan={2} style={{padding:"12px",fontWeight:800,fontSize:14,color:"#1D4ED8"}}>
                  TOTAL AKTIVEN
                </td>
                <td style={{padding:"12px",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                             fontWeight:800,fontSize:15,color:"#1D4ED8"}}>
                  CHF {fmt(totalAkt)}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>

        {/* PASSIVEN */}
        <div style={{background:"white",borderRadius:10,border:"1px solid #BBF7D0",overflow:"hidden",
                     boxShadow:"0 1px 4px rgba(21,128,61,.08)"}}>
          <div style={{padding:"11px 14px",background:"#F0FDF4",borderBottom:"1px solid #BBF7D0",
                       fontWeight:800,fontSize:13,color:"#15803D",letterSpacing:.5}}>
            PASSIVEN
          </div>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <tbody>
              {pasGroups.map(g=><SideSection key={g} accs={passiven} group={g} color="#15803D"/>)}
              {/* Jahresergebnis */}
              <tr>
                <td colSpan={3} style={{padding:"8px 12px 3px",fontWeight:700,fontSize:10.5,
                                         color:"#64748B",textTransform:"uppercase",letterSpacing:.5}}>
                  Jahresergebnis {year}
                </td>
              </tr>
              <tr style={{borderBottom:"1px solid #E2E8F0"}}>
                <td style={{padding:"4px 12px 7px 22px",fontSize:11.5,
                             fontFamily:"'JetBrains Mono',monospace",color:MUTED}}>2900</td>
                <td style={{padding:"4px 12px 7px",fontSize:13}}>
                  {jahrRes>=0?"Jahresgewinn":"Jahresverlust"} {year}
                </td>
                <td style={{padding:"4px 12px 7px",textAlign:"right",
                             fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,
                             color:jahrRes>=0?"#15803D":"#DC2626"}}>
                  {jahrRes>=0?"":"-"}{fmt(Math.abs(jahrRes))}
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr style={{background:"#F0FDF4",borderTop:"2px solid #15803D"}}>
                <td colSpan={2} style={{padding:"12px",fontWeight:800,fontSize:14,color:"#15803D"}}>
                  TOTAL PASSIVEN
                </td>
                <td style={{padding:"12px",textAlign:"right",fontFamily:"'JetBrains Mono',monospace",
                             fontWeight:800,fontSize:15,color:"#15803D"}}>
                  CHF {fmt(totalPas)}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      {!balanced&&(
        <div style={{marginTop:12,padding:"8px 12px",background:"#FEF2F2",borderRadius:6,
                     fontSize:12,color:"#DC2626",border:"1px solid #FECACA"}}>
          ⚠ Die Bilanz ist um CHF {fmt(diff)} nicht ausgeglichen. Prüfe die Eröffnungsbuchungen.
        </div>
      )}

      {(fxMissingRate.length>0||fxOpenLoss.length>0)&&(
        <div className="no-print" style={{marginTop:12,padding:"8px 12px",background:"#FFFBEB",borderRadius:6,
                     fontSize:12,color:"#92400E",border:"1px solid #FDE68A"}}>
          ⚠ Fremdwährungsbewertung per 31.12.{year} unvollständig:
          {fxMissingRate.length>0&&<> Stichtagskurs fehlt für {[...new Set(fxMissingRate.map(r=>r.account.currency))].join(", ")}.</>}
          {fxOpenLoss.length>0&&<> Ungebuchte Kursverluste auf {fxOpenLoss.map(r=>r.account.number).join(", ")}
            {" "}(CHF {fmt(fxOpenLoss.reduce((s,r)=>s+Math.abs(r.diff),0))}).</>}
          {" "}→ Tab «Fremdwährung».
        </div>
      )}

      {fxRows.length>0&&(
        <div style={{marginTop:16,background:"white",borderRadius:10,border:"1px solid #FED7AA",overflow:"hidden"}}>
          <div style={{padding:"9px 14px",background:"#FFF7ED",borderBottom:"1px solid #FED7AA",
                       fontWeight:700,fontSize:12,color:"#C2410C",letterSpacing:.4}}>
            FREMDWÄHRUNGSPOSITIONEN PER 31.12.{year} · Angaben für den Anhang
          </div>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr>
              <Th>Konto</Th><Th>Bezeichnung</Th><Th>Währung</Th>
              <Th align="right">Betrag FW</Th><Th align="right">Stichtagskurs</Th><Th align="right">Bilanzwert CHF</Th>
            </tr></thead>
            <tbody>
              {fxRows.map(r=>(
                <tr key={r.account.number}>
                  <Td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:MUTED}}>{r.account.number}</Td>
                  <Td>{r.account.name}</Td>
                  <Td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:"#C2410C"}}>{r.account.currency}</Td>
                  <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace"}}>{fmt(r.fxSaldo)}</Td>
                  <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",color:r.rate?"#0F172A":"#DC2626"}}>
                    {r.rate?fmtRate(r.rate):"fehlt"}
                  </Td>
                  <Td align="right" style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600}}>{fmt(r.book)}</Td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// TAB: ERFOLGSRECHNUNG
// ═══════════════════════════════════════════════════════════════
function ErfolgsrechnungTab({ accounts, getSaldo, year }) {
  const erAccs = accounts.filter(a=>a.category==="ertrag" ).sort((a,b)=>a.number.localeCompare(b.number));
  const awAccs = accounts.filter(a=>a.category==="aufwand").sort((a,b)=>a.number.localeCompare(b.number));
  const totEr  = erAccs.reduce((s,a)=>s+getSaldo(a.number,year),0);
  const totAw  = awAccs.reduce((s,a)=>s+getSaldo(a.number,year),0);
  const jahrRes= totEr - totAw;

  const erGroups = [...new Set(erAccs.map(a=>a.group))];
  const awGroups = [...new Set(awAccs.map(a=>a.group))];

  const Section = ({ accs, groups, title, color, bg, border }) => (
    <div style={{background:"white",borderRadius:10,border:`1px solid ${border}`,
                 overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.05)",marginBottom:14}}>
      <div style={{padding:"11px 16px",background:bg,borderBottom:`1px solid ${border}`,
                   fontWeight:800,fontSize:13,color,letterSpacing:.5}}>
        {title}
      </div>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <tbody>
          {groups.map(group=>{
            const ga = accs.filter(a=>a.group===group);
            const gt = ga.reduce((s,a)=>s+getSaldo(a.number,year),0);
            return (
              <Fragment key={group}>
                <tr>
                  <td colSpan={3} style={{padding:"7px 16px 3px",fontWeight:700,fontSize:10.5,
                                           color:"#64748B",textTransform:"uppercase",letterSpacing:.5}}>
                    {group}
                  </td>
                </tr>
                {ga.map(a=>{
                  const s=getSaldo(a.number,year);
                  return (
                    <tr key={a.number} className="hover-row">
                      <td style={{padding:"4px 16px 4px 26px",fontSize:11.5,
                                  fontFamily:"'JetBrains Mono',monospace",color:MUTED,width:60}}>{a.number}</td>
                      <td style={{padding:"4px 16px",fontSize:13}}>{a.name}</td>
                      <td style={{padding:"4px 16px",textAlign:"right",
                                  fontFamily:"'JetBrains Mono',monospace",fontSize:13,
                                  fontWeight:s!==0?500:400,color:s!==0?"#0F172A":"#CBD5E1"}}>
                        {s!==0?fmt(s):"—"}
                      </td>
                    </tr>
                  );
                })}
                <tr style={{borderBottom:"1px solid #E2E8F0"}}>
                  <td colSpan={2} style={{padding:"3px 16px 7px 26px",
                                          fontSize:11.5,color:MUTED,fontStyle:"italic"}}>
                    Subtotal {group}
                  </td>
                  <td style={{padding:"3px 16px 7px",textAlign:"right",
                               fontFamily:"'JetBrains Mono',monospace",fontSize:13,
                               fontWeight:600,color}}>{fmt(gt)}</td>
                </tr>
              </Fragment>
            );
          })}
        </tbody>
        <tfoot>
          <tr style={{background:bg,borderTop:`2px solid ${color}`}}>
            <td colSpan={2} style={{padding:"12px 16px",fontWeight:800,fontSize:14,color}}>
              TOTAL {title}
            </td>
            <td style={{padding:"12px 16px",textAlign:"right",
                         fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:15,color}}>
              CHF {fmt(accs===erAccs?totEr:totAw)}
            </td>
          </tr>
        </tfoot>
      </table>
    </div>
  );

  const exportERWord = () => {
    const renderSection = (title, accs, groups, color, total) => {
      let h = `<table><tr><th colspan="3" style="background:${color}11;color:${color};font-size:11pt">${title}</th></tr>`;
      groups.forEach(group => {
        const ga = accs.filter(a=>a.group===group);
        const gt = ga.reduce((s,a)=>s+getSaldo(a.number,year),0);
        h += `<tr class="section-header"><td colspan="3">${group}</td></tr>`;
        ga.forEach(a => {
          const s = getSaldo(a.number,year);
          h += `<tr><td class="muted" style="width:60pt">${a.number}</td><td>${a.name}</td><td class="amount">${s!==0?fmt(s):"—"}</td></tr>`;
        });
        h += `<tr><td colspan="2" class="subtotal">Subtotal ${group}</td><td class="amount" style="font-weight:600;color:${color}">${fmt(gt)}</td></tr>`;
      });
      h += `<tr class="total-row" style="color:${color}"><td colspan="2">TOTAL ${title}</td><td class="amount">CHF ${fmt(total)}</td></tr></table>`;
      return h;
    };
    let html = `<h1>Verein Werckmeister</h1><h2>Erfolgsrechnung ${year} · 1. Januar – 31. Dezember</h2>`;
    html += renderSection("ERTRÄGE", erAccs, erGroups, "#059669", totEr);
    html += renderSection("AUFWÄNDE", awAccs, awGroups, "#DC2626", totAw);
    const resColor = jahrRes>=0 ? "#15803D" : "#DC2626";
    html += `<table><tr class="total-row" style="color:${resColor}"><td colspan="2" style="font-size:12pt">${jahrRes>=0?"JAHRESGEWINN":"JAHRESVERLUST"} ${year}</td>` +
      `<td class="amount" style="font-size:14pt">CHF ${fmt(Math.abs(jahrRes))}</td></tr>` +
      `<tr><td colspan="3" class="muted" style="font-size:9pt;border:none">Erträge ${fmt(totEr)} – Aufwände ${fmt(totAw)}</td></tr></table>`;
    exportWord(html, `Werckmeister_Erfolgsrechnung_${year}.docx`);
  };

  return (
    <div>
      <div className="no-print" style={{display:"flex",justifyContent:"space-between",
                                        alignItems:"center",marginBottom:16}}>
        <span style={{fontSize:13,color:"#64748B"}}>
          Erfolgsrechnung {year} · 1. Januar – 31. Dezember
        </span>
        <div style={{display:"flex",gap:8}}>
          <button onClick={exportERWord} style={SB}>📄 Word Export</button>
          <button onClick={()=>window.print()} style={SB}>🖨 Drucken / PDF</button>
        </div>
      </div>

      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontWeight:800,fontSize:18,letterSpacing:-.5}}>Verein Werckmeister</div>
        <div style={{color:"#64748B",fontSize:13,marginTop:3}}>Erfolgsrechnung {year}</div>
      </div>

      <div style={{maxWidth:720,margin:"0 auto"}}>
        <Section accs={erAccs} groups={erGroups} title="ERTRÄGE"
          color="#059669" bg="#ECFDF5" border="#A7F3D0"/>
        <Section accs={awAccs} groups={awGroups} title="AUFWÄNDE"
          color="#DC2626" bg="#FEF2F2" border="#FECACA"/>

        {/* Jahresergebnis box */}
        <div style={{
          background: jahrRes>=0?"#F0FDF4":"#FEF2F2",
          border:`2px solid ${jahrRes>=0?"#16A34A":"#DC2626"}`,
          borderRadius:10, padding:"16px 20px",
          display:"flex",justifyContent:"space-between",alignItems:"center",
          boxShadow:"0 2px 8px rgba(0,0,0,.07)",
        }}>
          <div>
            <div style={{fontWeight:800,fontSize:16,
                         color:jahrRes>=0?"#15803D":"#DC2626",letterSpacing:.3}}>
              {jahrRes>=0?"JAHRESGEWINN":"JAHRESVERLUST"} {year}
            </div>
            <div style={{fontSize:12,color:MUTED,marginTop:3}}>
              Erträge {fmt(totEr)} – Aufwände {fmt(totAw)}
            </div>
          </div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:800,fontSize:22,
                       color:jahrRes>=0?"#15803D":"#DC2626"}}>
            CHF {fmt(Math.abs(jahrRes))}
          </div>
        </div>
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// TAB: FREMDWÄHRUNG (Stichtagskurse & Bewertung)
// ═══════════════════════════════════════════════════════════════
function FremdwaehrungTab({ accounts, setAccounts, setEntries, getSaldo, getFxSaldo, fxRates, setFxRates, year }) {
  const rates = fxRates?.[year] || {};
  const currencies = [...new Set(accounts.map(a=>a.currency).filter(c=>c&&c!==CHF))].sort();
  const findDefault = (num) => accounts.find(a=>a.number===num) ? num : "";
  const [gainAcc, setGainAcc] = useState(()=>findDefault(FX_GAIN_ACCOUNT.number));
  const [lossAcc, setLossAcc] = useState(()=>findDefault(FX_LOSS_ACCOUNT.number));
  const [override, setOverride] = useState({}); // Kontonummer → bool (Buchen ja/nein)
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");

  const setRate = (cur, v) => setFxRates(p=>({ ...p, [year]: { ...(p?.[year]||{}), [cur]: v } }));

  const rows = computeFxValuation({ accounts, getSaldo, getFxSaldo, rates, year });
  const isChecked = (r) => override[r.account.number] ?? r.defaultBook;
  const toBook = rows.filter(r=>r.diff && isChecked(r));

  const missingStdAccounts = [FX_GAIN_ACCOUNT, FX_LOSS_ACCOUNT].filter(s=>!accounts.find(a=>a.number===s.number));
  const createStdAccounts = () => {
    setAccounts(p=>[...p, ...missingStdAccounts].sort((a,b)=>a.number.localeCompare(b.number)));
    if(!gainAcc) setGainAcc(FX_GAIN_ACCOUNT.number);
    if(!lossAcc) setLossAcc(FX_LOSS_ACCOUNT.number);
  };

  const book = () => {
    setMsg(""); setErr("");
    if(toBook.some(r=>r.isGain)  && !gainAcc){ setErr("Bitte Konto für Kursgewinne wählen."); return; }
    if(toBook.some(r=>!r.isGain) && !lossAcc){ setErr("Bitte Konto für Kursverluste wählen."); return; }
    const newEntries = toBook.map((r,i)=>makeRevalEntry(r, gainAcc, lossAcc, year, i));
    setEntries(p=>[...p, ...newEntries]);
    setOverride({});
    setMsg(`✓ ${newEntries.length} Bewertungsbuchung${newEntries.length===1?"":"en"} per 31.12.${year} erfasst (Beleg FW-BEW-${year}).`);
  };

  const mono = "'JetBrains Mono',monospace";
  const incomeAccs  = accounts.filter(a=>a.category==="ertrag");
  const expenseAccs = accounts.filter(a=>a.category==="aufwand");
  const shortSel = (list, value, onChange) => (
    <select value={value} onChange={e=>onChange(e.target.value)} style={IS}>
      <option value="">Konto wählen…</option>
      {list.slice().sort((a,b)=>a.number.localeCompare(b.number)).map(a=>(
        <option key={a.number} value={a.number}>{a.number} – {a.name}</option>
      ))}
    </select>
  );

  if(currencies.length===0) return (
    <div style={{maxWidth:820,margin:"0 auto"}}>
      <Card title="Fremdwährungskonten">
        <div style={{fontSize:13,color:"#334155",lineHeight:1.7}}>
          Noch keine Fremdwährungskonten vorhanden. Lege im <strong>Kontenplan</strong> ein Aktiv- oder Passivkonto
          mit Währung an, z. B. <span style={{fontFamily:mono}}>1021 Bankkonto EUR</span> (Währung <span style={{fontFamily:mono}}>EUR</span>)
          oder <span style={{fontFamily:mono}}>2001 Kreditoren USD</span>.
        </div>
      </Card>
      <FxRulesInfo/>
    </div>
  );

  return (
    <div style={{maxWidth:1000,margin:"0 auto"}}>
      <Card title={`Stichtagskurse per 31.12.${year}`}>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"end"}}>
          {currencies.map(c=>(
            <Field key={c} label={`CHF / 1 ${c}`} style={{width:150}}>
              <input type="number" step="0.0001" min="0" value={rates[c]??""} placeholder="0.0000"
                onChange={e=>setRate(c,e.target.value)}
                style={{...IS,fontFamily:mono,textAlign:"right"}}/>
            </Field>
          ))}
          <div style={{fontSize:11.5,color:MUTED,maxWidth:380,lineHeight:1.5}}>
            Devisenkurs (Mittelkurs) am Bilanzstichtag, z. B. gemäss Jahresend-Kursliste der ESTV
            oder Bankauszug per 31.12. Die Kurse werden mit den Daten gespeichert.
          </div>
        </div>
      </Card>

      <Card title={`Bewertung der Fremdwährungskonten per 31.12.${year}`}>
        <div style={{overflow:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:860}}>
            <thead><tr>
              <Th>Konto</Th>
              <Th align="right">Saldo FW</Th>
              <Th align="right">Buchwert CHF</Th>
              <Th align="right">Ø Buchkurs</Th>
              <Th align="right">Stichtagskurs</Th>
              <Th align="right">Wert CHF</Th>
              <Th align="right">Differenz</Th>
              <Th align="center">Buchen</Th>
            </tr></thead>
            <tbody>
              {rows.map(r=>{
                const a = r.account;
                const avg = r.fxSaldo ? r.book/r.fxSaldo : null;
                return (
                  <tr key={a.number} className="hover-row">
                    <Td>
                      <span style={{fontFamily:mono,fontWeight:700,fontSize:12,
                                    color:a.category==="aktiven"?"#1D4ED8":"#15803D"}}>{a.number}</span>
                      <span style={{marginLeft:6}}>{a.name}</span><CurBadge cur={a.currency}/>
                    </Td>
                    <Td align="right" style={{fontFamily:mono,color:"#C2410C"}}>{fmt(r.fxSaldo)}</Td>
                    <Td align="right" style={{fontFamily:mono}}>{fmt(r.book)}</Td>
                    <Td align="right" style={{fontFamily:mono,fontSize:12,color:MUTED}}>{avg?fmtRate(avg):"—"}</Td>
                    <Td align="right" style={{fontFamily:mono,fontSize:12}}>
                      {r.rate?fmtRate(r.rate):<span style={{color:"#DC2626",fontFamily:"inherit"}}>Kurs fehlt</span>}
                    </Td>
                    <Td align="right" style={{fontFamily:mono}}>{r.target!==null?fmt(r.target):"—"}</Td>
                    <Td align="right" style={{fontFamily:mono,fontWeight:600,
                         color:!r.diff?"#CBD5E1":r.isGain?"#059669":"#DC2626"}}>
                      {!r.diff ? (r.rate?"0.00":"—") : <>
                        {r.isGain?"+":"−"}{fmt(Math.abs(r.diff))}
                        <div style={{fontSize:10,fontWeight:400,fontFamily:"inherit"}}>
                          {r.isGain?"Kursgewinn":"Kursverlust"}
                        </div>
                      </>}
                    </Td>
                    <Td align="center">
                      {r.diff ? (
                        <label style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer"}}>
                          <input type="checkbox" checked={isChecked(r)}
                            disabled={!r.isGain}
                            title={!r.isGain?"Kursverluste müssen gebucht werden (Vorsichtsprinzip)":""}
                            onChange={e=>setOverride(p=>({...p,[a.number]:e.target.checked}))}/>
                          {r.isGain && !r.gainAllowed && (
                            <span style={{fontSize:9.5,color:"#92400E",maxWidth:110,lineHeight:1.2}}>
                              unrealisiert – Imparitätsprinzip
                            </span>
                          )}
                        </label>
                      ) : <span style={{color:"#CBD5E1"}}>—</span>}
                    </Td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:10,alignItems:"end",marginTop:14}}>

// ═══════════════════════════════════════════════════════════════
// KI-CLIENT: Anthropic oder OpenAI-kompatibler (lokaler) Server
// ═══════════════════════════════════════════════════════════════
// parts: [{type:"text",text}, {type:"image",mime,data}, {type:"pdf",data}] (data = base64)

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";
let pdfjsPromise = null;
const loadPdfJs = () => {
  if(!pdfjsPromise) pdfjsPromise = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = `${PDFJS_BASE}/pdf.min.js`;
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/pdf.worker.min.js`;
                       resolve(window.pdfjsLib); };
    s.onerror = () => { pdfjsPromise = null; reject(new Error("pdf.js konnte nicht geladen werden")); };
    document.head.appendChild(s);
  });
  return pdfjsPromise;
};

// Lokale Modelle verstehen keine PDFs: Text extrahieren, bei Scans Seiten als Bild rendern
const pdfToParts = async (b64, mode) => {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({ data: Uint8Array.from(atob(b64), c=>c.charCodeAt(0)) }).promise;
  if(mode!=="image"){
    let text = "";
    for(let i=1; i<=Math.min(doc.numPages,10); i++){
      const tc = await (await doc.getPage(i)).getTextContent();
      text += tc.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join("") + "\n\n";
    }
    if(text.replace(/\s/g,"").length >= 30)
      return [{ type:"text", text:`Inhalt des PDF-Belegs (extrahierter Text):\n${text.trim()}` }];
  }
  const parts = [];
  for(let i=1; i<=Math.min(doc.numPages,3); i++){
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale:2 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext:canvas.getContext("2d"), viewport:vp }).promise;
    parts.push({ type:"image", mime:"image/png", data:canvas.toDataURL("image/png").split(",")[1] });
  }
  return parts;
};

const apiErrorText = (data, status) => {
  const e = data?.error;
  return (typeof e==="string" ? e : e?.message) || `HTTP ${status}`;
};

const callLLM = async ({ system, parts, maxTokens }) => {
  const C = LLM_CONFIG;
  const max_tokens = Math.round(maxTokens * C.maxTokensFactor);
  const TRUNC = "Antwort abgeschnitten (max_tokens erreicht) – in config.js csvBatchSize verkleinern oder maxTokensFactor erhöhen.";
  let res;

  if(C.provider==="anthropic"){
    if(!C.apiKey) throw new Error("Kein API-Key – bitte config.js anlegen (siehe config.example.js).");
    const content = parts.map(p =>
      p.type==="text" ? { type:"text", text:p.text }
      : p.type==="pdf" ? { type:"document", source:{ type:"base64", media_type:"application/pdf", data:p.data } }
      : { type:"image", source:{ type:"base64", media_type:p.mime, data:p.data } });
    res = await fetch(`${C.baseUrl}/messages`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key":C.apiKey, "anthropic-version":"2023-06-01",
                "anthropic-dangerous-direct-browser-access":"true" },
      body: JSON.stringify({ model:C.model, max_tokens, system, messages:[{ role:"user", content }] }),
    });
    const data = await res.json().catch(()=>null);
    if(!res.ok || data?.error) throw new Error(apiErrorText(data, res.status));
    if(data.stop_reason==="max_tokens") throw new Error(TRUNC);
    return (data.content||[]).map(b=>b.text||"").join("");
  }

  // OpenAI-kompatibel (Ollama, LM Studio, llama.cpp, vLLM …)
  const expanded = [];
  for(const p of parts) expanded.push(...(p.type==="pdf" ? await pdfToParts(p.data, C.pdfMode) : [p]));
  const content = expanded.map(p => p.type==="text"
    ? { type:"text", text:p.text }
    : { type:"image_url", image_url:{ url:`data:${p.mime};base64,${p.data}` } });
  const onlyText = content.every(c=>c.type==="text");
  const body = {
    model:C.model, max_tokens, temperature:0,
    messages:[ { role:"system", content:system },
               { role:"user", content: onlyText ? content.map(c=>c.text).join("\n\n") : content } ],
  };
  if(C.jsonMode) body.response_format = { type:"json_object" };
  try {
    res = await fetch(`${C.baseUrl}/chat/completions`, {
      method:"POST",
      headers:{ "Content-Type":"application/json", ...(C.apiKey ? { Authorization:`Bearer ${C.apiKey}` } : {}) },
      body: JSON.stringify(body),
    });
  } catch {
    throw new Error(`Modell-Server unter ${C.baseUrl} nicht erreichbar – läuft er, und erlaubt er CORS `+
                    `(Ollama: OLLAMA_ORIGINS="*", LM Studio: «Enable CORS»)?`);
  }
  const data = await res.json().catch(()=>null);
  if(!res.ok || data?.error) throw new Error(apiErrorText(data, res.status));
  const choice = data?.choices?.[0];
  if(choice?.finish_reason==="length") throw new Error(TRUNC);
  return choice?.message?.content || "";
};

// JSON aus der Modellantwort holen (toleriert <think>-Blöcke, Code-Fences und Begleittext)
const parseLLMJson = (raw) => {
  const s = String(raw||"").replace(/<think>[\s\S]*?<\/think>/gi,"")
              .replace(/^\s*```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
  if(!s) throw new Error("Keine Antwort vom Modell erhalten");
  try { return JSON.parse(s); } catch {}
  const starts = [s.indexOf("{"), s.indexOf("[")].filter(i=>i>=0);
  const end = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
  if(starts.length && end>Math.min(...starts)) {
    try { return JSON.parse(s.slice(Math.min(...starts), end+1)); } catch {}
  }
  throw new Error("Antwort des Modells ist kein gültiges JSON");
};

// Kontonummern prüfen – kleine Modelle erfinden gerne Konten
const checkSuggestionAccounts = (s, accounts) => {
  for(const k of ["debit","credit"])
    if(!accounts.some(a=>a.number===s[k]))
      return `${k==="debit"?"Soll":"Haben"}-Konto «${s[k]||"—"}» existiert nicht im Kontenplan.`;
  return null;
};
